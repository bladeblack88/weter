
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#100522">

<title>Донецк — Neon Purple Clock</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #100522;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background:
        radial-gradient(ellipse at 50% 40%,
            rgba(139, 0, 255, .30), transparent 65%),
        radial-gradient(ellipse at 50% 90%,
            rgba(70, 0, 160, .25), transparent 70%),
        linear-gradient(135deg,
            #100522, #19083b, #080319);
}

.app {
    width: 100%;
    height: 100%;
    height: 100vh;
    padding: 18px 3%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: center;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    text-align: left;
}

.city {
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow: 0 0 12px #bb66ff;
}

.date {
    font-size: 15px;
    margin-top: 8px;
    opacity: .85;
}

.source {
    text-align: right;
    font-size: 13px;
    line-height: 1.6;
    color: #d8a8ff;
}

.clock-area {
    width: 100%;
    margin: auto 0;
}

/* ГЛАВНЫЕ ЧАСЫ */

.clock {
    display: block !important;
    width: 100%;
    text-align: center;
    white-space: nowrap;
    font-size: 22vw !important;
    font-weight: 300;
    letter-spacing: 3px;
    line-height: 1.2;
    color: #fff;

    text-shadow:
        0 0 5px #fff,
        0 0 12px #e4aaff,
        0 0 25px #bd38ff,
        0 0 45px #a000ff,
        0 0 80px #7800ff;
}

.seconds {
    font-size: 5vw !important;
    vertical-align: 25%;
    margin-left: 3px;
    color: #e6c5ff;
    text-shadow:
        0 0 10px #cf7bff,
        0 0 25px #a000ff;
}

/* ТЕМПЕРАТУРА */

.temperature {
    font-size: 85px;
    font-weight: 300;
    margin-top: 25px;
    color: #fff;

    text-shadow:
        0 0 10px #fff,
        0 0 25px #d47bff,
        0 0 55px #9900ff;
}

.description {
    font-size: 22px;
    margin-top: 8px;
    color: #f2dcff;
}

.details {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    font-size: 17px;
    margin: 22px 0;
}

.details span {
    text-shadow: 0 0 8px #a900ff;
}

/* ПРОГНОЗ */

.forecast-title {
    font-size: 17px;
    letter-spacing: 3px;
    margin: 15px 0;
    color: #e6c4ff;
    text-shadow: 0 0 12px #a000ff;
}

.forecast {
    display: flex;
    width: 100%;
    justify-content: center;
    gap: 6px;
}

.hour {
    flex: 1;
    min-width: 0;
    border: 1px solid rgba(200, 110, 255, .85);
    border-radius: 15px;

    background:
        linear-gradient(145deg,
        rgba(125, 35, 200, .30),
        rgba(40, 10, 85, .55));

    box-shadow:
        0 0 8px rgba(170, 40, 255, .5),
        inset 0 0 12px rgba(160, 60, 255, .12);

    padding: 12px 3px;
}

.hour-time {
    font-size: 15px;
    font-weight: bold;
    color: #f3dfff;
}

.hour-icon {
    font-size: 25px;
    margin: 9px 0;
}

.hour-temp {
    font-size: 21px;
    font-weight: bold;
    text-shadow: 0 0 10px #bc5aff;
}

.hour-rain {
    font-size: 12px;
    margin-top: 7px;
    color: #d9a6ff;
}

/* КНОПКА */

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    font-size: 12px;
    opacity: .9;
}

button {
    border: 1px solid #d28bff;
    color: white;

    background:
        linear-gradient(135deg,
        rgba(150, 40, 255, .65),
        rgba(75, 15, 150, .65));

    border-radius: 25px;
    padding: 12px 22px;
    font-size: 15px;

    box-shadow:
        0 0 12px #9b20ff,
        0 0 28px rgba(160, 0, 255, .35);
}

button:active {
    background: #8c00ff;
}

.status {
    font-size: 12px;
    margin-top: 8px;
    opacity: .75;
    color: #d6aaff;
}

/* ПЛАНШЕТ В ГОРИЗОНТАЛЬНОМ РЕЖИМЕ */

@media (orientation: landscape) {
    .clock {
        font-size: 22vw !important;
    }

    .seconds {
        font-size: 5vw !important;
    }
}

/* ПЛАНШЕТ В ВЕРТИКАЛЬНОМ РЕЖИМЕ */

@media (orientation: portrait) {
    .clock {
        font-size: 17vw !important;
    }

    .seconds {
        font-size: 5vw !important;
    }

    .forecast {
        flex-wrap: wrap;
    }

    .hour {
        flex: 1 1 20%;
    }
}

/* НИЗКИЙ ЭКРАН */

@media (max-height: 650px) {
    .app {
        padding: 10px 3%;
    }

    .clock {
        font-size: 19vw !important;
    }

    .temperature {
        font-size: 65px;
        margin-top: 8px;
    }

    .details {
        margin: 10px 0;
        gap: 10px;
    }

    .hour {
        padding: 7px 2px;
    }

    .forecast-title {
        margin: 8px 0;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div>
            <div class="city">ДОНЕЦК · ДНР</div>
            <div class="date" id="date">Загрузка даты...</div>
        </div>

        <div class="source">
            LIVE WEATHER<br>
            MET Norway
        </div>
    </div>

    <div class="clock-area">

        <div class="clock">
            <span id="hours">00:00</span><span class="seconds" id="seconds">00</span>
        </div>

        <div class="temperature" id="temperature">--°</div>

        <div class="description" id="description">
            Загрузка погоды...
        </div>

        <div class="details">
            <span>🌡 Ощущается: <b id="feels">--°</b></span>
            <span>💧 Влажность: <b id="humidity">--%</b></span>
            <span>🌬 Ветер: <b id="wind">-- м/с</b></span>
            <span>🌡 Давление: <b id="pressure">-- мм</b></span>
        </div>

    </div>

    <div>

        <div class="forecast-title">
            ПРОГНОЗ НА БЛИЖАЙШИЕ 8 ЧАСОВ
        </div>

        <div class="forecast" id="forecast">
            <div>Загрузка прогноза...</div>
        </div>

        <div class="bottom">
            <span id="updated">MET Norway</span>
            <button onclick="loadWeather()">↻ Обновить</button>
        </div>

        <div class="status" id="status">
            Подключение к погодному сервису...
        </div>

    </div>

</div>

<script>

var LAT = 48.0159;
var LON = 37.8029;

var API =
"https://api.met.no/weatherapi/locationforecast/2.0/compact?lat="
+ LAT + "&lon=" + LON;

var lastData = null;

var MONTHS = [
    "января", "февраля", "марта",
    "апреля", "мая", "июня",
    "июля", "августа", "сентября",
    "октября", "ноября", "декабря"
];

var DAYS = [
    "воскресенье", "понедельник",
    "вторник", "среда", "четверг",
    "пятница", "суббота"
];

function moscowDate() {
    return new Date(
        new Date().toLocaleString("en-US", {
            timeZone: "Europe/Moscow"
        })
    );
}

function updateClock() {

    var now = moscowDate();

    var h = String(now.getHours()).padStart(2, "0");
    var m = String(now.getMinutes()).padStart(2, "0");
    var s = String(now.getSeconds()).padStart(2, "0");

    document.getElementById("hours").innerHTML =
        h + ":" + m;

    document.getElementById("seconds").innerHTML = s;

    document.getElementById("date").innerHTML =
        DAYS[now.getDay()] + ", " +
        now.getDate() + " " +
        MONTHS[now.getMonth()] + " " +
        now.getFullYear();
}

function weatherIcon(symbol) {

    if (!symbol) return "🌤";

    if (symbol.indexOf("thunder") >= 0) return "⛈";
    if (symbol.indexOf("snow") >= 0) return "❄️";
    if (symbol.indexOf("sleet") >= 0) return "🌨";
    if (symbol.indexOf("rain") >= 0) return "🌧";
    if (symbol.indexOf("fog") >= 0) return "🌫";
    if (symbol.indexOf("cloudy") >= 0) return "☁️";
    if (symbol.indexOf("partlycloudy") >= 0) return "🌤";
    if (symbol.indexOf("clearsky") >= 0) return "☀️";
    if (symbol.indexOf("fair") >= 0) return "🌤";

    return "☁️";
}

function loadWeather() {

    document.getElementById("status").innerHTML =
        "Обновление MET Norway...";

    var xhr = new XMLHttpRequest();

    xhr.open("GET", API + "&_=" + Date.now(), true);

    xhr.timeout = 20000;

    xhr.onreadystatechange = function() {

        if (xhr.readyState !== 4) return;

        if (xhr.status === 200) {

            try {

                var data = JSON.parse(xhr.responseText);

                lastData = data;

                try {
                    localStorage.setItem(
                        "donetsk_weather",
                        xhr.responseText
                    );
                } catch(e) {}

                displayWeather(data);

                document.getElementById("status").innerHTML =
                    "● MET Norway подключён";

            } catch(e) {

                showError("Ошибка обработки данных");

            }

        } else {

            showError("Ошибка HTTP: " + xhr.status);

        }
    };

    xhr.onerror = function() {
        showError("Нет соединения с погодным сервисом");
    };

    xhr.ontimeout = function() {
        showError("Время ожидания превышено");
    };

    xhr.send();
}

function showError(message) {

    document.getElementById("status").innerHTML =
        message + " · Проверяем сохранённые данные";

    if (!lastData) {

        try {

            var saved = localStorage.getItem(
                "donetsk_weather"
            );

            if (saved) {

                lastData = JSON.parse(saved);

                displayWeather(lastData);

                document.getElementById("status").innerHTML =
                    "Показаны последние сохранённые данные";

            }

        } catch(e) {}
    }
}

function displayWeather(data) {

    var series = data.properties.timeseries;

    if (!series || !series.length) return;

    var current = series[0].data;
    var instant = current.instant.details;

    var temp = instant.air_temperature;
    var humidity = instant.relative_humidity;
    var wind = instant.wind_speed;
    var pressure = instant.air_pressure_at_sea_level;

    document.getElementById("temperature").innerHTML =
        Math.round(temp) + "°";

    document.getElementById("description").innerHTML =
        weatherIcon(getSymbol(current)) +
        " Погода MET Norway";

    // Оценка температуры с учётом ветра.
    // Это приближённый показатель, а не отдельное измерение API.
    var feels = temp;

    if (temp <= 10 && wind > 1.3) {
        var v = wind * 3.6;
        feels = 13.12 + 0.6215 * temp
            - 11.37 * Math.pow(v, 0.16)
            + 0.3965 * temp * Math.pow(v, 0.16);
    }

    document.getElementById("feels").innerHTML =
        Math.round(feels) + "°";

    document.getElementById("humidity").innerHTML =
        Math.round(humidity) + "%";

    document.getElementById("wind").innerHTML =
        wind.toFixed(1) + " м/с";

    document.getElementById("pressure").innerHTML =
        Math.round(pressure * 0.75006) + " мм";

    var html = "";
    var count = 0;
    var now = Date.now();

    for (var i = 0; i < series.length && count < 8; i++) {

        var item = series[i];
        var date = new Date(item.time);

        if (date.getTime() <= now) continue;

        var details = item.data.instant.details;
        var next = item.data.next_1_hours;

        var symbol = "";
        var rain = 0;

        if (next) {
            symbol = next.summary.symbol_code;
            rain = next.details.precipitation_amount || 0;
        } else {
            symbol = getSymbol(item.data);
        }

        var hour = date.toLocaleTimeString("ru-RU", {
            timeZone: "Europe/Moscow",
            hour: "2-digit",
            minute: "2-digit"
        });

        html +=
            '<div class="hour">' +
            '<div class="hour-time">' + hour + '</div>' +
            '<div class="hour-icon">' +
            weatherIcon(symbol) + '</div>' +
            '<div class="hour-temp">' +
            Math.round(details.air_temperature) + '°</div>' +
            '<div class="hour-rain">💧 ' +
            rain.toFixed(1) + ' мм</div>' +
            '</div>';

        count++;
    }

    document.getElementById("forecast").innerHTML =
        html || "Нет данных прогноза";

    document.getElementById("updated").innerHTML =
        "Обновлено: " +
        new Date().toLocaleTimeString("ru-RU", {
            timeZone: "Europe/Moscow",
            hour: "2-digit",
            minute: "2-digit"
        });
}

function getSymbol(current) {

    if (current.next_1_hours) {
        return current.next_1_hours.summary.symbol_code;
    }

    if (current.next_6_hours) {
        return current.next_6_hours.summary.symbol_code;
    }

    return "";
}

// ЗАПУСК ЧАСОВ

updateClock();

setInterval(updateClock, 1000);

// ПЕРВАЯ ЗАГРУЗКА ПОГОДЫ

loadWeather();

// ОБНОВЛЕНИЕ КАЖДЫЕ 30 МИНУТ

setInterval(loadWeather, 30 * 60 * 1000);

// ПОВТОРНАЯ ЗАГРУЗКА ПРИ ВОЗВРАЩЕНИИ В SAFARI

document.addEventListener("visibilitychange", function() {

    if (!document.hidden) {
        loadWeather();
    }

});

window.addEventListener("online", function() {
    loadWeather();
});

</script>

</body>
</html>
