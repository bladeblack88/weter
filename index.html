
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Тест погодных сервисов</title>

<style>
* {box-sizing:border-box}

body {
 background:#08152b;
 color:white;
 font-family:Arial,sans-serif;
 margin:0;
 padding:15px;
}

h1 {
 text-align:center;
 font-size:25px;
 color:#8bd7ff;
}

.subtitle {
 text-align:center;
 color:#b9cce5;
 font-size:14px;
}

button {
 background:#1269bb;
 border:1px solid #80caff;
 border-radius:12px;
 color:white;
 padding:15px;
 font-size:17px;
 width:100%;
 margin:10px 0;
}

.card {
 background:rgba(35,65,100,.55);
 border:1px solid #42658c;
 border-radius:12px;
 padding:13px;
 margin:12px 0;
}

.name {
 font-size:19px;
 font-weight:bold;
}

.status {
 margin-top:8px;
 font-size:15px;
}

.ok {color:#62ff9a}
.bad {color:#ff7777}
.wait {color:#ffdb75}

.info {
 font-size:13px;
 color:#c4d7ef;
 margin-top:8px;
 line-height:1.6;
 word-break:break-word;
}

pre {
 white-space:pre-wrap;
 word-break:break-word;
 font-size:11px;
 color:#a9dfff;
 background:#07101e;
 padding:8px;
 border-radius:7px;
}

input {
 width:100%;
 padding:12px;
 font-size:16px;
 border-radius:8px;
 margin:5px 0;
}

</style>
</head>

<body>

<h1>ПОГОДНЫЙ СКАНЕР</h1>

<div class="subtitle">
Донецк · ДНР<br>
Проверка совместимости с iPad mini 1
</div>

<button onclick="startTests()">
▶ ПРОВЕРИТЬ ВСЕ ИСТОЧНИКИ
</button>

<div id="summary" class="card">
Ожидание проверки...
</div>

<div id="results"></div>

<script>

var LAT=48.0159;
var LON=37.8028;

var results={};

function xhr(url,callback) {

 var x=new XMLHttpRequest();
 var done=false;
 var start=Date.now();

 function finish(ok,data,error) {

  if(done)return;
  done=true;

  callback({
   ok:ok,
   data:data,
   error:error,
   time:Date.now()-start,
   status:x.status
  });
 }

 try {

  x.open("GET",url,true);
  x.timeout=15000;

  x.onreadystatechange=function() {

   if(x.readyState!==4)return;

   if(x.status>=200&&x.status<300) {

    try {
     finish(true,JSON.parse(x.responseText),null);
    } catch(e) {
     finish(false,null,"Ошибка JSON");
    }

   } else {
    finish(false,null,"HTTP "+x.status);
   }
  };

  x.onerror=function() {
   finish(false,null,"Ошибка сети / CORS / TLS");
  };

  x.ontimeout=function() {
   finish(false,null,"Тайм-аут 15 секунд");
  };

  x.send(null);

 } catch(e) {
  finish(false,null,e.message);
 }
}


function show(name,ok,time,info,error,data) {

 results[name]=ok;

 var card=document.getElementById("card-"+name);

 if(!card)return;

 document.getElementById("status-"+name).innerHTML=
 ok?
 '<span class="ok">● ПОДКЛЮЧЕНО</span>':
 '<span class="bad">● НЕ РАБОТАЕТ</span>';

 document.getElementById("info-"+name).innerHTML=
 "Время ответа: "+time+" мс<br>"+
 (info||"");

 if(error) {
  document.getElementById("info-"+name).innerHTML+=
  '<br><span class="bad">Ошибка: '+error+'</span>';
 }

 if(data) {
  document.getElementById("data-"+name).textContent=
  JSON.stringify(data,null,2).substring(0,1800);
 }

 updateSummary();
}


function createCard(name,title) {

 var div=document.createElement("div");

 div.className="card";
 div.id="card-"+name;

 div.innerHTML=
 '<div class="name">'+title+'</div>'+
 '<div class="status" id="status-'+name+'">'+
 '<span class="wait">● ПРОВЕРКА...</span></div>'+
 '<div class="info" id="info-'+name+'">Ожидание...</div>'+
 '<pre id="data-'+name+'">Нет данных</pre>';

 document.getElementById("results").appendChild(div);
}


function updateSummary() {

 var total=0;
 var good=0;

 for(var k in results) {
  total++;
  if(results[k])good++;
 }

 document.getElementById("summary").innerHTML=
 '<b>РЕЗУЛЬТАТ ПРОВЕРКИ</b><br><br>'+
 'Проверено: '+total+'<br>'+
 'Работает: <span class="ok">'+good+'</span><br>'+
 'Не работает: <span class="bad">'+
 (total-good)+'</span>';
}


/* OPEN METEO */

function testOpenMeteo() {

 var url=
 "https://api.open-meteo.com/v1/forecast"+
 "?latitude="+LAT+
 "&longitude="+LON+
 "&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,pressure_msl"+
 "&hourly=temperature_2m,precipitation_probability"+
 "&forecast_days=1"+
 "&timezone=Europe%2FMoscow";

 xhr(url,function(r) {

  if(!r.ok) {
   show("open",false,r.time,"",r.error);
   return;
  }

  var c=r.data.current;

  show("open",true,r.time,
   "Температура: "+c.temperature_2m+"°C<br>"+
   "Ощущается: "+c.apparent_temperature+"°C<br>"+
   "Влажность: "+c.relative_humidity_2m+"%<br>"+
   "Ветер: "+c.wind_speed_10m+" м/с<br>"+
   "Давление: "+c.pressure_msl+" гПа",
   null,c);
 });
}


/* WTTR.IN */

function testWttr() {

 xhr("https://wttr.in/48.0159,37.8028?format=j1",
 function(r) {

  if(!r.ok) {
   show("wttr",false,r.time,"",r.error);
   return;
  }

  var c=r.data.current_condition[0];

  show("wttr",true,r.time,
   "Температура: "+c.temp_C+"°C<br>"+
   "Ощущается: "+c.FeelsLikeC+"°C<br>"+
   "Влажность: "+c.humidity+"%<br>"+
   "Ветер: "+c.windspeedKmph+" км/ч<br>"+
   "Давление: "+c.pressure+" гПа",
   null,c);
 });
}


/* MET NORWAY */

function testMet() {

 var url=
 "https://api.met.no/weatherapi/locationforecast/2.0/compact"+
 "?lat="+LAT+"&lon="+LON;

 xhr(url,function(r) {

  if(!r.ok) {
   show("met",false,r.time,"",r.error);
   return;
  }

  var c=r.data.properties.timeseries[0].data.instant.details;

  show("met",true,r.time,
   "Температура: "+c.air_temperature+"°C<br>"+
   "Влажность: "+c.relative_humidity+"%<br>"+
   "Ветер: "+c.wind_speed+" м/с<br>"+
   "Давление: "+c.air_pressure_at_sea_level+" гПа",
   null,c);
 });
}


/* 7 TIMER */

function testTimer() {

 var url=
 "https://www.7timer.info/bin/api.pl"+
 "?lon="+LON+
 "&lat="+LAT+
 "&product=civil"+
 "&output=json";

 xhr(url,function(r) {

  if(!r.ok) {
   show("timer",false,r.time,"",r.error);
   return;
  }

  var d=r.data.dataseries[0];

  show("timer",true,r.time,
   "Температура: "+d.temp2m+"°C<br>"+
   "Облачность: "+d.cloud+"<br>"+
   "Ветер: "+d.wind10m.speed+" м/с<br>"+
   "Прогнозных интервалов: "+r.data.dataseries.length,
   null,d);
 });
}


/* GISMETEO: проверяем доступность сайта */

function testGismeteo() {

 var div=document.getElementById("info-gismeteo");

 div.innerHTML=
 'Открывается ли сайт: <a style="color:#8bd7ff" href="https://www.gismeteo.ru/weather-donetsk-5080/" target="_blank">ОТКРЫТЬ ГИСМЕТЕО</a><br>'+
 'Прямая проверка API требует отдельного доступа.';

 document.getElementById("status-gismeteo").innerHTML=
 '<span class="wait">● ТРЕБУЕТ ПРОВЕРКИ ВРУЧНУЮ</span>';

 results.gismeteo=null;
}


function startTests() {

 results={};

 document.getElementById("results").innerHTML="";

 createCard("open","1. OPEN-METEO");
 createCard("wttr","2. WTTR.IN");
 createCard("met","3. MET NORWAY");
 createCard("timer","4. 7TIMER");
 createCard("gismeteo","5. GISMETEO");

 document.getElementById("summary").innerHTML=
 "Выполняется проверка...";

 testGismeteo();
 testOpenMeteo();
 testWttr();
 testMet();
 testTimer();
}

</script>

</body>
</html>
