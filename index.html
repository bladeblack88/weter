
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Погода Донецк">
<meta name="theme-color" content="#101c2a">

<title>Донецк — Часы и погода</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    background: #101c2a;
}

body {
    min-height: 100vh;
}

#background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background:
      linear-gradient(rgba(5,12,25,.35),rgba(5,12,25,.65)),
      url("https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1800")
      center center / cover no-repeat;
    z-index: 0;
    transition: opacity 1s;
}

.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      180deg,
      rgba(5,15,30,.2),
      rgba(5,15,30,.3) 55%,
      rgba(5,15,30,.82)
    );
    z-index: 1;
}

.app {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 22px 5% 15px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.city {
    font-size: clamp(20px, 3vw, 32px);
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 2px 12px black;
}

.date {
    font-size: 15px;
    margin-top: 8px;
    opacity: .9;
}

.status {
    text-align: right;
    font-size: 12px;
    line-height: 1.6;
    color: #d9eaff;
}

.center {
    text-align: center;
    margin: auto 0;
}

.clock {
    font-size: clamp(85px, 17vw, 190px);
    font-weight: 200;
    line-height: 1.05;
    letter-spacing: 5px;
    font-variant-numeric: tabular-nums;
    color: white;

    text-shadow:
      0 0 5px #fff,
      0 0 15px #65c8ff,
      0 0 35px #249aff,
      0 0 70px rgba(0,130,255,.8),
      0 5px 20px #000;

    -webkit-text-stroke: 1px rgba(180,220,255,.8);
}

.seconds {
    font-size: .38em;
    vertical-align: 15%;
    letter-spacing: 1px;
}

.weather-main {
    margin-top: 15px;
}

.temperature {
    font-size: clamp(48px, 8vw, 85px);
    font-weight: 200;
    text-shadow: 0 3px 20px black;
}

.description {
    font-size: clamp(17px, 2.5vw, 25px);
    margin-top: 5px;
    text-shadow: 0 2px 10px black;
}

.details {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
    margin-top: 22px;
    font-size: clamp(13px, 1.7vw, 18px);
    text-shadow: 0 2px 10px black;
}

.bottom {
    padding-top: 15px;
}

.hourly-title {
    text-align: center;
    font-size: 15px;
    letter-spacing: 2px;
    margin-bottom: 13px;
    opacity: .9;
}

.hourly {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 8px;
}

.hour {
    background: rgba(12,28,48,.65);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 15px;
    padding: 12px 3px;
    text-align: center;

    box-shadow: 0 5px 20px rgba(0,0,0,.2);

    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
}

.hour-time {
    font-size: clamp(11px, 1.5vw, 16px);
    opacity: .85;
}

.hour-icon {
    font-size: clamp(20px, 3vw, 32px);
    margin: 10px 0;
}

.hour-temp {
    font-size: clamp(14px, 2vw, 21px);
    font-weight: bold;
}

.hour-rain {
    font-size: 10px;
    opacity: .8;
    margin-top: 6px;
}

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 13px;
    font-size: 11px;
    opacity: .8;
}

.source {
    color: white;
    text-decoration: none;
}

.refresh {
    background: rgba(255,255,255,.15);
    color: white;
    border: 1px solid rgba(255,255,255,.4);
    padding: 9px 16px;
    border-radius: 20px;
    font-size: 13px;
}

.refresh:active {
    background: rgba(255,255,255,.4);
}

.error {
    color: #ffcccc;
    font-size: 13px;
    margin-top: 10px;
}

@media (orientation: portrait) {
    .app {
        padding-left: 4%;
        padding-right: 4%;
    }

    .hourly {
        grid-template-columns: repeat(4, 1fr);
    }

    .hour {
        padding: 8px 2px;
    }

    .details {
        gap: 12px;
    }

    .clock {
        font-size: clamp(75px, 19vw, 130px);
    }
}

@media (max-height: 500px) {
    .app {
        padding-top: 10px;
        padding-bottom: 8px;
    }

    .clock {
        font-size: clamp(65px, 14vw, 115px);
    }

    .temperature {
        font-size: 48px;
    }

    .weather-main {
        margin-top: 0;
    }

    .details {
        margin-top: 8px;
    }

    .hour {
        padding: 6px 2px;
    }

    .hour-icon {
        margin: 4px 0;
    }

    .hourly-title {
        margin-bottom: 6px;
    }

    .bottom {
        padding-top: 5px;
    }

    .footer {
        margin-top: 5px;
    }
}
</style>
</head>

<body>

<div id="background"></div>
<div class="overlay"></div>

<div class="app">

    <div class="top">
        <div>
            <div class="city">ДОНЕЦК · ДНР</div>
            <div class="date" id="date">Загрузка даты...</div>
        </div>

        <div class="status">
            <div>LIVE WEATHER</div>
            <div id="updated">Подключение...</div>
        </div>
    </div>

    <div class="center">

        <div class="clock" id="clock">
            00:00<span class="seconds">:00</span>
        </div>

        <div class="weather-main">

            <div class="temperature" id="temperature">--°</div>

            <div class="description" id="description">
                Загрузка погоды...
            </div>

            <div class="details">
                <span id="feels">🌡 Ощущается: --°</span>
                <span id="humidity">💧 Влажность: --%</span>
                <span id="wind">💨 Ветер: -- м/с</span>
            </div>

            <div class="error" id="error"></div>

        </div>
    </div>

    <div class="bottom">

        <div class="hourly-title">
            ПРОГНОЗ НА БЛИЖАЙШИЕ 8 ЧАСОВ
        </div>

        <div class="hourly" id="hourly">
            <div class="hour">Загрузка...</div>
        </div>

        <div class="footer">

            <a class="source"
               href="https://www.gismeteo.ru/weather-donetsk-5080/"
               target="_blank">
               Погода · Гисметео
            </a>

            <button class="refresh" onclick="loadWeather()">
                ↻ Обновить
            </button>

        </div>
    </div>

</div>

<script>

/* НАСТРОЙКИ */

var LAT = 48.0159;
var LON = 37.8028;

var TIMEZONE = "Europe/Moscow";

var API =
"https://api.open-meteo.com/v1/forecast" +
"?latitude=" + LAT +
"&longitude=" + LON +
"&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m" +
"&hourly=temperature_2m,precipitation_probability,weather_code" +
"&forecast_days=2" +
"&timezone=Europe%2FMoscow" +
"&wind_speed_unit=ms";


/* ОПИСАНИЯ ПОГОДЫ */

var descriptions = {
    0: "Ясно",
    1: "Преимущественно ясно",
    2: "Переменная облачность",
    3: "Пасмурно",
    45: "Туман",
    48: "Изморозь",
    51: "Лёгкая морось",
    53: "Морось",
    55: "Сильная морось",
    61: "Небольшой дождь",
    63: "Дождь",
    65: "Сильный дождь",
    71: "Небольшой снег",
    73: "Снег",
    75: "Сильный снег",
    80: "Ливень",
    81: "Сильный ливень",
    82: "Очень сильный ливень",
    85: "Снегопад",
    86: "Сильный снегопад",
    95: "Гроза",
    96: "Гроза с градом",
    99: "Сильная гроза"
};


/* ПОГОДНЫЕ ИКОНКИ */

function getIcon(code, day) {

    if (code === 0) {
        return day ? "☀️" : "🌙";
    }

    if (code <= 2) {
        return day ? "🌤️" : "☁️";
    }

    if (code === 3) return "☁️";

    if (code <= 48) return "🌫️";

    if (code <= 55) return "🌦️";

    if (code <= 65) return "🌧️";

    if (code <= 77) return "❄️";

    if (code <= 82) return "🌧️";

    if (code <= 86) return "🌨️";

    return "⛈️";
}


/* ДОНЕЦКОЕ ВРЕМЯ */

function updateClock() {

    var now = new Date();

    try {

        var time = new Intl.DateTimeFormat("ru-RU", {
            timeZone: TIMEZONE,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        }).format(now);

        var date = new Intl.DateTimeFormat("ru-RU", {
            timeZone: TIMEZONE,
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }).format(now);

        var parts = time.split(":");

        document.getElementById("clock").innerHTML =
            parts[0] + ":" + parts[1] +
            '<span class="seconds">:' +
            parts[2] + '</span>';

        document.getElementById("date").textContent = date;

    } catch(e) {

        document.getElementById("clock").textContent =
            now.getHours() + ":" +
            now.getMinutes();

        document.getElementById("date").textContent =
            now.toLocaleDateString("ru-RU");

    }
}


/* ФОТОГРАФИЯ ПОГОДЫ */

function setBackground(code, day) {

    var url;

    if (code <= 1) {

        if (day) {
            url = "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1800";
        } else {
            url = "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1800";
        }

    } else if (code <= 3) {

        url = "https://images.unsplash.com/photo-1534088568595-a066f410bcda?w=1800";

    } else if (code <= 48) {

        url = "https://images.unsplash.com/photo-1485236715568-ddc5ee6ca227?w=1800";

    } else if (code <= 65 || code <= 82) {

        url = "https://images.unsplash.com/photo-1519692933481-e162a57d6721?w=1800";

    } else if (code <= 86) {

        url = "https://images.unsplash.com/photo-1517299321609-52687d1bc55a?w=1800";

    } else {

        url = "https://images.unsplash.com/photo-1500673922987-e212871fec22?w=1800";

    }

    document.getElementById("background").style.backgroundImage =
        'linear-gradient(rgba(5,12,25,.35),rgba(5,12,25,.65)),url("' +
        url + '")';
}


/* ЗАГРУЗКА ПОГОДЫ */

function loadWeather() {

    var updated = document.getElementById("updated");
    var error = document.getElementById("error");

    updated.textContent = "Обновление...";
    error.textContent = "";

    fetch(API, {cache: "no-store"})

    .then(function(response) {

        if (!response.ok) {
            throw new Error("Ошибка сервера погоды");
        }

        return response.json();

    })

    .then(function(data) {

        if (!data.current || !data.hourly) {
            throw new Error("Нет погодных данных");
        }

        var c = data.current;
        var h = data.hourly;

        var code = c.weather_code;
        var day = c.is_day === 1;

        /* Температура */

        document.getElementById("temperature").textContent =
            Math.round(c.temperature_2m) + "°";

        /* Описание */

        document.getElementById("description").textContent =
            getIcon(code, day) + " " +
            (descriptions[code] || "Переменная погода");

        /* Ощущается */

        document.getElementById("feels").textContent =
            "🌡 Ощущается: " +
            Math.round(c.apparent_temperature) + "°";

        /* Влажность */

        document.getElementById("humidity").textContent =
            "💧 Влажность: " +
            c.relative_humidity_2m + "%";

        /* Ветер */

        document.getElementById("wind").textContent =
            "💨 Ветер: " +
            Math.round(c.wind_speed_10m * 10) / 10 + " м/с";

        /* Фон */

        setBackground(code, day);

        /* Почасовой прогноз */

        var start = 0;

        for (var j = 0; j < h.time.length; j++) {

            if (h.time[j] > c.time) {
                start = j;
                break;
            }

            if (j === h.time.length - 1) {
                start = j;
            }
        }

        var html = "";

        for (
            var i = start;
            i < start + 8 && i < h.time.length;
            i++
        ) {

            var hour = h.time[i].substring(11, 16);

            var weatherCode = h.weather_code[i];

            var hourIcon = getIcon(
                weatherCode,
                parseInt(hour.substring(0, 2), 10) >= 7 &&
                parseInt(hour.substring(0, 2), 10) < 20
            );

            var rain = h.precipitation_probability[i];

            if (rain === null || rain === undefined) {
                rain = 0;
            }

            html +=
                '<div class="hour">' +

                    '<div class="hour-time">' +
                    hour +
                    '</div>' +

                    '<div class="hour-icon">' +
                    hourIcon +
                    '</div>' +

                    '<div class="hour-temp">' +
                    Math.round(h.temperature_2m[i]) +
                    '°</div>' +

                    '<div class="hour-rain">' +
                    '💧 ' + rain + '%' +
                    '</div>' +

                '</div>';
        }

        document.getElementById("hourly").innerHTML = html;

        updated.textContent =
            "Обновлено: " +
            new Date().toLocaleTimeString("ru-RU", {
                hour: "2-digit",
                minute: "2-digit"
            });

    })

    .catch(function(e) {

        updated.textContent = "Нет соединения";

        error.textContent =
            "Не удалось загрузить погоду. Проверьте интернет.";

        console.log("Weather error:", e);

    });
}


/* ЗАПУСК ЧАСОВ */

updateClock();

setInterval(updateClock, 1000);


/* ЗАГРУЗКА ПОГОДЫ */

loadWeather();

setInterval(loadWeather, 30 * 60 * 1000);


/* ПРИ ВОЗВРАЩЕНИИ НА СТРАНИЦУ */

document.addEventListener("visibilitychange", function() {

    if (!document.hidden) {

        updateClock();

        loadWeather();

    }

});


/* ПОДДЕРЖКА WAKE LOCK, ЕСЛИ ДОСТУПНА */

var wakeLock = null;

function keepAwake() {

    if ("wakeLock" in navigator) {

        navigator.wakeLock.request("screen")

        .then(function(lock) {

            wakeLock = lock;

        })

        .catch(function(e) {

            console.log("Wake Lock недоступен:", e);

        });

    }
}

document.addEventListener("click", keepAwake);

document.addEventListener("visibilitychange", function() {

    if (!document.hidden) {
        keepAwake();
    }

});

</script>

</body>
</html>
