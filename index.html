<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
 width:100%;height:100%;overflow:hidden;

}
#background{

}
.overlay{

}
.app{

 height:100vh;padding:17px 3% 10px;
 display:-webkit-box;display:-webkit-flex;display:flex;

 flex-direction:column;

}

/* СЕМИСЕГМЕНТНЫЕ ЧАСЫ */

.clock{
 display:-webkit-box;display:-webkit-flex;display:flex;
 -webkit-box-pack:center;-webkit-justify-content:center;

 -webkit-box-align:center;-webkit-align-items:center;align-items:center;

 height:155px;
}
.digit{

 margin:0 3px;
 overflow:visible;
}
.digit polygon{

 stroke-width:1;
}
.digit polygon.on{
 fill:#d8f5ff;
 stroke:#83d8ff;
 stroke-width:1;
 filter:url(#glow);
}
.colon{
 width:13px;height:110px;position:relative;margin:0 5px;
}
.colon:before,.colon:after{
 content:"";position:absolute;left:2px;
 width:9px;height:9px;border-radius:50%;
 background:#b9efff;
 box-shadow:0 0 8px #fff,0 0 20px #008cff,0 0 35px #008cff;
}
.colon:before{top:35px}
.colon:after{top:70px}

}

.temperature{

}

.details{

}

.bottom{width:100%;padding-top:9px}

 text-align:center;font-size:16px;letter-spacing:2px;
 margin-bottom:10px;
}

 display:-webkit-box;display:-webkit-flex;display:flex;
 width:100%;-webkit-flex-wrap:nowrap;flex-wrap:nowrap;
}

 min-width:0;margin:0 3px;padding:10px 2px;
 text-align:center;background:rgba(12,28,48,.78);
 border:1px solid rgba(255,255,255,.3);
 border-radius:12px;
}
.hour-time{font-size:14px}
.hour-icon{font-size:27px;margin:7px 0}
.hour-temp{font-size:21px;font-weight:bold}
.hour-rain{font-size:11px;margin-top:5px}

/* ВЫБОР ИСТОЧНИКА */

.source-title{
 text-align:center;font-size:12px;
 letter-spacing:2px;margin-top:12px;margin-bottom:7px;

}
.sources{
 display:-webkit-box;display:-webkit-flex;display:flex;
 -webkit-flex-wrap:wrap;flex-wrap:wrap;
 -webkit-box-pack:center;-webkit-justify-content:center;
 justify-content:center;
}
.source-button{
 display:none;
 color:#dcecff;background:rgba(20,50,90,.65);
 border:1px solid rgba(140,195,255,.4);
 border-radius:20px;padding:8px 15px;
 margin:3px;font-size:13px;
}
.source-button.active{
 background:rgba(0,115,255,.5);
 border:1px solid #83d8ff;
 box-shadow:0 0 12px rgba(0,145,255,.55);
 color:white;
}
.source-button:disabled{opacity:.5}
.footer{
 display:-webkit-box;display:-webkit-flex;display:flex;
 -webkit-box-pack:justify;-webkit-justify-content:space-between;

 align-items:center;margin-top:8px;font-size:12px;
}
.footer a{color:white;text-decoration:none}
.refresh{
 background:rgba(255,255,255,.16);color:white;
 border:1px solid rgba(255,255,255,.5);

}

@media screen and (orientation:portrait){
 .city{font-size:20px}
 .clock{height:115px}

 .colon:before{top:27px}

}
@media screen and (max-height:650px) and (orientation:landscape){
 .app{padding-top:6px;padding-bottom:5px}

 .clock{height:110px}
 .digit{width:65px;height:105px}
 .colon{height:85px}
 .colon:before{top:25px}
 .colon:after{top:55px}
 .seconds{font-size:23px}
 .temperature{font-size:53px}
 .weather-main{margin-top:0}
 .description{font-size:18px}
 .details{font-size:13px;margin-top:3px}
 .hourly-title{margin-bottom:5px}
 .hour{padding:5px 2px}
 .hour-icon{font-size:20px;margin:3px}
 .hour-temp{font-size:17px}
 .source-title{margin-top:5px;margin-bottom:3px}
 .source-button{padding:5px 12px;margin:2px}
 .footer{margin-top:3px}
}
</style>

<div class="app">

<script>

/* =================================
   НАСТРОЙКИ
================================= */

var LAT=48.0159;
var LON=37.8028;

var API_OPEN=
"https://api.open-meteo.com/v1/forecast"+
"?latitude="+LAT+"&longitude="+LON+
"&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,pressure_msl"+
"&hourly=temperature_2m,precipitation_probability,weather_code"+
"&forecast_days=2&timezone=Europe%2FMoscow&wind_speed_unit=ms";

var API_WTTR=
"https://wttr.in/48.0159,37.8028?format=j1&lang=ru";

var API_MET=
"https://api.met.no/weatherapi/locationforecast/2.0/compact?lat="+LAT+"&lon="+LON;


/* =================================
   СЕМИСЕГМЕНТНЫЕ ЦИФРЫ
================================= */

var patterns={
 "0":"abcdef",
 "1":"bc",
 "2":"abged",
 "3":"abgcd",
 "4":"fgbc",
 "5":"afgcd",
 "6":"afgecd",
 "7":"abc",
 "8":"abcdefg",
 "9":"abfgcd"
};

var polygons={
 a:"12,5 88,5 78,17 22,17",
 b:"87,9 95,17 95,77 83,87 83,23",
 c:"87,93 95,103 95,163 83,171 83,107",
 d:"12,163 88,163 78,175 22,175",
 e:"5,103 17,93 17,163 5,171",
 f:"5,17 17,9 17,87 5,77",
 g:"17,86 27,78 73,78 83,86 73,96 27,96"
};

function makeDigit(n){
 var active=patterns[n]||"";
 var html='<svg class="digit" viewBox="0 0 100 180" xmlns="http://www.w3.org/2000/svg">';
 html+='<defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';

 for(var key in polygons){
  html+='<polygon points="'+polygons[key]+'" class="'+
  (active.indexOf(key)>=0?'on':'')+'"/>';
 }
 html+='</svg>';
 return html;
}

function updateClock(){
 var d=new Date();
 var local=new Date(d.getTime()+d.getTimezoneOffset()*60000+10800000);

 var hh=two(local.getUTCHours());
 var mm=two(local.getUTCMinutes());
 var ss=two(local.getUTCSeconds());

 var html=makeDigit(hh.charAt(0))+makeDigit(hh.charAt(1));
 html+='<div class="colon"></div>';
 html+=makeDigit(mm.charAt(0))+makeDigit(mm.charAt(1));
 html+='<div class="seconds">'+ss+'</div>';

 document.getElementById("clock").innerHTML=html;

 var days=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
 var months=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

 document.getElementById("date").textContent=
 days[local.getUTCDay()]+", "+local.getUTCDate()+" "+months[local.getUTCMonth()]+" "+local.getUTCFullYear();
}

function two(n){return n<10?"0"+n:""+n;}


/* =================================
   ПОГОДНЫЕ ИКОНКИ
================================= */

function icon(code,day){
 if(code===0)return day?"☀️":"🌙";
 if(code<=2)return day?"🌤️":"☁️";
 if(code===3)return "☁️";
 if(code<=48)return "🌫️";
 if(code<=55)return "🌦️";
 if(code<=65)return "🌧️";
 if(code<=77)return "❄️";
 if(code<=82)return "🌧️";
 if(code<=86)return "🌨️";
 return "⛈️";
}

var descriptions={
 0:"Ясно",1:"Преимущественно ясно",2:"Переменная облачность",
 3:"Пасмурно",45:"Туман",48:"Изморозь",
 51:"Морось",53:"Морось",55:"Сильная морось",
 61:"Небольшой дождь",63:"Дождь",65:"Сильный дождь",
 71:"Небольшой снег",73:"Снег",75:"Сильный снег",
 80:"Ливень",81:"Сильный ливень",82:"Очень сильный ливень",
 85:"Снегопад",86:"Сильный снегопад",
 95:"Гроза",96:"Гроза с градом",99:"Сильная гроза"
};

function background(code,day){
 var url;
 if(code===0) url=day?
 "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1400":
 "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1400";
 else if(code<=3)
 url="https://images.unsplash.com/photo-1534088568595-a066f410bcda?w=1400";
 else if(code<=48)
 url="https://images.unsplash.com/photo-1485236715568-ddc5ee6ca227?w=1400";
 else if(code<=65||code<=82)
 url="https://images.unsplash.com/photo-1519692933481-e162a57d6721?w=1400";
 else
 url="https://images.unsplash.com/photo-1517299321609-52687d1bc55a?w=1400";

 document.getElementById("background").style.backgroundImage=
 'linear-gradient(rgba(5,12,25,.35),rgba(5,12,25,.75)),url("'+url+'")';
}


/* =================================
   ОТОБРАЖЕНИЕ ПОГОДЫ
================================= */

var activeSource="";
var available={};
var cache={};

function showWeather(data){

 document.getElementById("temperature").textContent=
 Math.round(data.temp)+"°";

 document.getElementById("description").textContent=
 data.icon+" "+data.description;

 document.getElementById("feels").textContent=
 "🌡 Ощущается: "+Math.round(data.feels)+"°";

 document.getElementById("humidity").textContent=
 "💧 Влажность: "+data.humidity+"%";

 document.getElementById("wind").textContent=
 "💨 Ветер: "+data.wind+" м/с";

 document.getElementById("pressure").textContent=
 "🌡 Давление: "+(data.pressure?
 Math.round(data.pressure*0.75006):"--")+" мм";

 background(data.code,data.day);

 var html="";
 for(var i=0;i<data.hourly.length&&i<8;i++){
  var h=data.hourly[i];
  html+='<div class="hour">'+
   '<div class="hour-time">'+h.time+'</div>'+
   '<div class="hour-icon">'+h.icon+'</div>'+
   '<div class="hour-temp">'+Math.round(h.temp)+'°</div>'+
   '<div class="hour-rain">💧 '+h.rain+'</div>'+
  '</div>';
 }

 document.getElementById("hourly").innerHTML=html;

 document.getElementById("updated").textContent=
 "Источник: "+data.name;

 document.getElementById("error").textContent="";

 try{
  localStorage.setItem("donetskWeather",JSON.stringify(data));
 }catch(e){}
}

function selectSource(name){
 if(!available[name]||!cache[name])return;
 activeSource=name;
 showWeather(cache[name]);
 renderSources();
}

function renderSources(){
 var names=["Open-Meteo","WTTR.IN","MET Norway"];
 var html="";

 for(var i=0;i<names.length;i++){
  var name=names[i];
  if(!available[name])continue;

  html+='<button class="source-button '+
   (activeSource===name?'active':'')+
   '" onclick="selectSource(\''+name+'\')">'+
   '● '+name+'</button>';
 }

 document.getElementById("sources").innerHTML=html;
}


/* =================================
   HTTP ЗАПРОС ДЛЯ IOS 9
================================= */

function request(url,callback){
 var x=new XMLHttpRequest();
 var finished=false;

 function end(ok,data){
  if(finished)return;
  finished=true;
  callback(ok,data);
 }

 x.open("GET",url,true);
 x.timeout=15000;

 x.onreadystatechange=function(){
  if(x.readyState!==4)return;
  if(x.status>=200&&x.status<300){
   try{end(true,JSON.parse(x.responseText));}
   catch(e){end(false,null);}
  }else end(false,null);
 };

 x.onerror=function(){end(false,null);};
 x.ontimeout=function(){end(false,null);};

 try{x.send(null);}catch(e){end(false,null);}
}


/* =================================
   OPEN-METEO
================================= */

function loadOpen(callback){
 request(API_OPEN,function(ok,data){
  if(!ok||!data.current||!data.hourly){
   callback(false);return;
  }

  var c=data.current;
  var h=data.hourly;
  var start=0;

  for(var j=0;j<h.time.length;j++){
   if(h.time[j]>c.time){start=j;break;}
  }

  var hourly=[];

  for(var i=start;i<start+8&&i<h.time.length;i++){
   var code=h.weather_code[i];
   hourly.push({
    time:h.time[i].substring(11,16),
    temp:h.temperature_2m[i],
    icon:icon(code,true),
    rain:(h.precipitation_probability[i]||0)+"%"
   });
  }

  callback(true,{
   name:"Open-Meteo",
   temp:c.temperature_2m,
   feels:c.apparent_temperature,
   humidity:c.relative_humidity_2m,
   wind:Math.round(c.wind_speed_10m*10)/10,
   pressure:c.pressure_msl,
   code:c.weather_code,
   day:c.is_day===1,
   icon:icon(c.weather_code,c.is_day===1),
   description:descriptions[c.weather_code]||"Переменная погода",
   hourly:hourly
  });
 });
}


/* =================================
   WTTR.IN
================================= */

function loadWttr(callback){
 request(API_WTTR,function(ok,data){
  if(!ok){callback(false);return;}

  try{
   if(data.data)data=data.data;

   var c=data.current_condition[0];
   var days=data.weather;
   var code=parseInt(c.weatherCode,10);
   var hourly=[];
   var now=new Date();
   var today=now.getFullYear()+"-"+two(now.getMonth()+1)+"-"+two(now.getDate());
   var currentHour=now.getHours();

   for(var d=0;d<days.length;d++){
    if(days[d].date!==today)continue;

    for(var i=0;i<days[d].hourly.length;i++){
     var item=days[d].hourly[i];
     var hour=Math.floor(parseInt(item.time,10)/100);

     if(hour<currentHour)continue;

     hourly.push({
      time:two(hour)+":00",
      temp:parseFloat(item.tempC),
      icon:"🌤️",
      rain:(parseInt(item.chanceofrain,10)||0)+"%"
     });
    }
   }

   if(hourly.length===0)throw new Error("No hourly");

   callback(true,{
    name:"WTTR.IN",
    temp:parseFloat(c.temp_C),
    feels:parseFloat(c.FeelsLikeC),
    humidity:parseInt(c.humidity,10),
    wind:Math.round(parseFloat(c.windspeedKmph)/3.6*10)/10,
    pressure:parseFloat(c.pressure),
    code:code,
    day:true,
    icon:"🌤️",
    description:"Погода по WTTR.IN",
    hourly:hourly.slice(0,8)
   });

  }catch(e){callback(false);}
 });
}


/* =================================
   MET NORWAY
================================= */

function loadMet(callback){
 request(API_MET,function(ok,data){
  if(!ok||!data.properties||!data.properties.timeseries){
   callback(false);return;
  }

  try{
   var series=data.properties.timeseries;
   var now=Date.now();
   var current=null;
   var hourly=[];

   for(var i=0;i<series.length;i++){
    var item=series[i];
    var t=new Date(item.time).getTime();
    var instant=item.data.instant.details;

    if(!current&&t<=now+3600000){
     current=instant;
    }

    if(t>=now&&hourly.length<8){
     var next=item.data.next_1_hours||item.data.next_6_hours;
     var symbol=next&&next.summary?next.summary.symbol_code:"cloudy";
     var rain=next&&next.details?
      next.details.precipitation_amount:0;

     hourly.push({
      time:two(new Date(t).getUTCHours())+":00",
      temp:instant.air_temperature,
      icon:metIcon(symbol),
      rain:(rain||0)+" мм"
     });
    }
   }

   if(!current||hourly.length===0)throw new Error("No MET data");

   var symbolNow=series[0].data.next_1_hours?
    series[0].data.next_1_hours.summary.symbol_code:"cloudy";

   callback(true,{
    name:"MET Norway",
    temp:current.air_temperature,
    feels:current.apparent_air_temperature||current.air_temperature,
    humidity:current.relative_humidity||0,
    wind:Math.round(current.wind_speed*10)/10,
    pressure:current.air_pressure_at_sea_level,
    code:3,
    day:true,
    icon:metIcon(symbolNow),
    description:metDescription(symbolNow),
    hourly:hourly
   });

  }catch(e){callback(false);}
 });
}

function metIcon(s){
 if(!s)return "☁️";
 if(s.indexOf("thunder")>=0)return "⛈️";
 if(s.indexOf("snow")>=0)return "❄️";
 if(s.indexOf("rain")>=0||s.indexOf("sleet")>=0)return "🌧️";
 if(s.indexOf("fog")>=0)return "🌫️";
 if(s.indexOf("clear")>=0)return "☀️";
 if(s.indexOf("partlycloudy")>=0)return "🌤️";
 return "☁️";
}

function metDescription(s){
 if(!s)return "Облачно";
 if(s.indexOf("thunder")>=0)return "Гроза";
 if(s.indexOf("snow")>=0)return "Снег";
 if(s.indexOf("rain")>=0)return "Дождь";
 if(s.indexOf("fog")>=0)return "Туман";
 if(s.indexOf("clear")>=0)return "Ясно";
 if(s.indexOf("partlycloudy")>=0)return "Переменная облачность";
 return "Облачно";
}


/* =================================
   ПРОВЕРКА ВСЕХ ИСТОЧНИКОВ
================================= */

var checking=false;

function checkAll(){
 if(checking)return;
 checking=true;

 document.getElementById("updated").textContent=
 "Проверка погоды...";

 var providers=[
  {name:"Open-Meteo",load:loadOpen},
  {name:"WTTR.IN",load:loadWttr},
  {name:"MET Norway",load:loadMet}
 ];

 var results=0;
 var previous=activeSource;

 function finish(){
  results++;

  if(results!==providers.length)return;

  checking=false;
  renderSources();

  if(previous&&available[previous]){
   selectSource(previous);
  }else{
   var order=["Open-Meteo","WTTR.IN","MET Norway"];
   var chosen=null;

   for(var i=0;i<order.length;i++){
    if(available[order[i]]){
     chosen=order[i];break;
    }
   }

   if(chosen){
    selectSource(chosen);
   }else{
    document.getElementById("updated").textContent=
     "Источники недоступны";

    document.getElementById("error").textContent=
     "Нет соединения с погодными сервисами. Проверим снова через 15 минут.";

    showSaved();
   }
  }
 }

 for(var i=0;i<providers.length;i++){
  (function(p){
   p.load(function(ok,data){
    available[p.name]=ok;

    if(ok){
     cache[p.name]=data;
    }else{
     delete cache[p.name];
    }

    finish();
   });
  })(providers[i]);
 }
}


/* =================================
   СОХРАНЁННАЯ ПОГОДА
================================= */

function showSaved(){
 try{
  var saved=localStorage.getItem("donetskWeather");
  if(saved){
   var data=JSON.parse(saved);
   document.getElementById("temperature").textContent=
    Math.round(data.temp)+"°";
   document.getElementById("description").textContent=
    data.icon+" "+data.description;
   document.getElementById("feels").textContent=
    "🌡 Ощущается: "+Math.round(data.feels)+"°";
   document.getElementById("humidity").textContent=
    "💧 Влажность: "+data.humidity+"%";
   document.getElementById("wind").textContent=
    "💨 Ветер: "+data.wind+" м/с";
   document.getElementById("pressure").textContent=
    "🌡 Давление: "+(data.pressure?
    Math.round(data.pressure*.75006):"--")+" мм";

   var html="";
   for(var i=0;i<data.hourly.length;i++){
    var h=data.hourly[i];
    html+='<div class="hour"><div class="hour-time">'+h.time+
    '</div><div class="hour-icon">'+h.icon+
    '</div><div class="hour-temp">'+Math.round(h.temp)+
    '°</div><div class="hour-rain">💧 '+h.rain+
    '</div></div>';
   }
   document.getElementById("hourly").innerHTML=html;
  }
 }catch(e){}
}


/* =================================
   ЗАПУСК
================================= */

updateClock();
setInterval(updateClock,1000);

try{
 var saved=localStorage.getItem("donetskWeather");
 if(saved)showSaved();
}catch(e){}

checkAll();

/* Повторная проверка всех источников */
setInterval(checkAll,15*60*1000);

/* При возвращении в браузер */
document.addEventListener("visibilitychange",function(){
 if(!document.hidden){
  updateClock();
  checkAll();
 }
});

</script>
</body>
