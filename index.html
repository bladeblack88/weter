<div class="app">

<script>

/* НАСТРОЙКИ */

var LAT=48.0159;
var LON=37.8028;

var API_OPEN=
"https://api.open-meteo.com/v1/forecast"+
"?latitude="+LAT+
"&longitude="+LON+
"&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,pressure_msl"+
"&hourly=temperature_2m,precipitation_probability,weather_code"+
"&forecast_days=2"+
"&timezone=Europe%2FMoscow"+
"&wind_speed_unit=ms";

var API_WTTR=
"https://wttr.in/48.0159,37.8028?format=j1&lang=ru";

var API_MET=
"https://api.met.no/weatherapi/locationforecast/2.0/compact?lat="+LAT+"&lon="+LON;


/* ЧАСЫ */

function two(n){
 return n<10?"0"+n:""+n;
}

function updateClock(){

 var d=new Date();

 /* Донецк: UTC+3 */
 var local=new Date(d.getTime()+d.getTimezoneOffset()*60000+10800000);

 document.getElementById("hours").innerHTML=
 two(local.getUTCHours());

 document.getElementById("minutes").innerHTML=
 two(local.getUTCMinutes());

 document.getElementById("seconds").innerHTML=
 two(local.getUTCSeconds());

 var days=[
  "воскресенье","понедельник","вторник",
  "среда","четверг","пятница","суббота"
 ];

 var months=[
  "января","февраля","марта","апреля",
  "мая","июня","июля","августа",
  "сентября","октября","ноября","декабря"
 ];

 document.getElementById("date").innerHTML=
 days[local.getUTCDay()]+", "+
 local.getUTCDate()+" "+
 months[local.getUTCMonth()]+" "+
 local.getUTCFullYear();
}

updateClock();
setInterval(updateClock,1000);


/* ПОГОДНЫЕ ИКОНКИ */

function weatherIcon(code,day){

 if(code===0)return day?"☀️":"🌙";
 if(code<=2)return day?"🌤️":"☁️";
 if(code===3)return "☁️";
 if(code<=48)return "🌫️";
 if(code<=55)return "🌦️";
 if(code<=65)return "🌧️";
 if(code<=77)return "❄️";
 if(code<=82)return "🌧️";
 if(code<=86)return "🌨️";
 return "⛈️";
}

var descriptions={
 0:"Ясно",
 1:"Преимущественно ясно",
 2:"Переменная облачность",
 3:"Пасмурно",
 45:"Туман",
 48:"Изморозь",
 51:"Морось",
 53:"Морось",
 55:"Сильная морось",
 61:"Небольшой дождь",
 63:"Дождь",
 65:"Сильный дождь",
 71:"Небольшой снег",
 73:"Снег",
 75:"Сильный снег",
 80:"Ливень",
 81:"Сильный ливень",
 82:"Очень сильный ливень",
 85:"Снегопад",
 86:"Сильный снегопад",
 95:"Гроза",
 96:"Гроза с градом",
 99:"Сильная гроза"
};


/* ПОГОДНЫЙ ФОН */

function setBackground(code,day){

 var url;

 if(code===0){
  url=day?
  "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1400":
  "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1400";
 }else if(code<=3){
  url="https://images.unsplash.com/photo-1534088568595-a066f410bcda?w=1400";
 }else if(code<=48){
  url="https://images.unsplash.com/photo-1485236715568-ddc5ee6ca227?w=1400";
 }else if(code<=65||code<=82){
  url="https://images.unsplash.com/photo-1519692933481-e162a57d6721?w=1400";
 }else{
  url="https://images.unsplash.com/photo-1517299321609-52687d1bc55a?w=1400";
 }

 document.getElementById("background").style.backgroundImage=
 'linear-gradient(rgba(5,12,25,.35),rgba(5,12,25,.75)),url("'+url+'")';
}


/* ПОГОДНЫЕ ДАННЫЕ */

var activeSource="";
var available={};
var cache={};
var checking=false;

function showWeather(data){

 document.getElementById("temperature").innerHTML=
 Math.round(data.temp)+"°";

 document.getElementById("description").innerHTML=
 data.icon+" "+data.description;

 document.getElementById("feels").innerHTML=
 "🌡 Ощущается: "+Math.round(data.feels)+"°";

 document.getElementById("humidity").innerHTML=
 "💧 Влажность: "+data.humidity+"%";

 document.getElementById("wind").innerHTML=
 "💨 Ветер: "+data.wind+" м/с";

 document.getElementById("pressure").innerHTML=
 "🌡 Давление: "+
 (data.pressure?Math.round(data.pressure*.75006):"--")+" мм";

 setBackground(data.code,data.day);

 var html="";

 for(var i=0;i<data.hourly.length&&i<8;i++){

  var h=data.hourly[i];

  html+='<div class="hour">'+
   '<div class="hour-time">'+h.time+'</div>'+
   '<div class="hour-icon">'+h.icon+'</div>'+
   '<div class="hour-temp">'+Math.round(h.temp)+'°</div>'+
   '<div class="hour-rain">💧 '+h.rain+'</div>'+
   '</div>';
 }

 document.getElementById("hourly").innerHTML=html;

 document.getElementById("updated").innerHTML=
 "Источник: "+data.name;

 document.getElementById("error").innerHTML="";

 try{
  localStorage.setItem("donetskWeather",JSON.stringify(data));
 }catch(e){}
}


/* ВЫБОР ИСТОЧНИКА */

function selectSource(name){

 if(!available[name]||!cache[name])return;

 activeSource=name;
 showWeather(cache[name]);
 renderSources();
}

function renderSources(){

 var names=["Open-Meteo","WTTR.IN","MET Norway"];
 var html="";

 for(var i=0;i<names.length;i++){

  var name=names[i];

  if(!available[name])continue;

  html+='<button class="source-button '+
   (activeSource===name?"active":"")+
   '" onclick="selectSource(\''+name+'\')">'+
   '● '+name+'</button>';
 }

 document.getElementById("sources").innerHTML=html;
}


/* ЗАПРОСЫ ДЛЯ СТАРОГО SAFARI */

function request(url,callback){

 var x=new XMLHttpRequest();
 var finished=false;

 function end(ok,data){
  if(finished)return;
  finished=true;
  callback(ok,data);
 }

 try{

  x.open("GET",url,true);
  x.timeout=15000;

  x.onreadystatechange=function(){

   if(x.readyState!==4)return;

   if(x.status>=200&&x.status<300){

    try{
     end(true,JSON.parse(x.responseText));
    }catch(e){
     end(false,null);
    }

   }else{
    end(false,null);
   }
  };

  x.onerror=function(){end(false,null);};
  x.ontimeout=function(){end(false,null);};

  x.send(null);

 }catch(e){
  end(false,null);
 }
}


/* OPEN-METEO */

function loadOpen(callback){

 request(API_OPEN,function(ok,data){

  if(!ok||!data.current||!data.hourly){
   callback(false);
   return;
  }

  var c=data.current;
  var h=data.hourly;
  var start=0;

  for(var j=0;j<h.time.length;j++){
   if(h.time[j]>=c.time){
    start=j;
    break;
   }
  }

  var hourly=[];

  for(var i=start;i<start+8&&i<h.time.length;i++){

   var code=h.weather_code[i];

   hourly.push({
    time:h.time[i].substring(11,16),
    temp:h.temperature_2m[i],
    icon:weatherIcon(code,true),
    rain:(h.precipitation_probability[i]||0)+"%"
   });
  }

  if(hourly.length===0){
   callback(false);
   return;
  }

  callback(true,{
   name:"Open-Meteo",
   temp:c.temperature_2m,
   feels:c.apparent_temperature,
   humidity:c.relative_humidity_2m,
   wind:Math.round(c.wind_speed_10m*10)/10,
   pressure:c.pressure_msl,
   code:c.weather_code,
   day:c.is_day===1,
   icon:weatherIcon(c.weather_code,c.is_day===1),
   description:descriptions[c.weather_code]||"Переменная погода",
   hourly:hourly
  });

 });
}


/* WTTR.IN */

function loadWttr(callback){

 request(API_WTTR,function(ok,data){

  if(!ok){
   callback(false);
   return;
  }

  try{

   if(data.data)data=data.data;

   var c=data.current_condition[0];
   var days=data.weather;
   var now=new Date();
   var currentHour=now.getUTCHours()+3;

   if(currentHour>=24)currentHour-=24;

   var today=new Date(now.getTime()+10800000);
   var todayString=
    today.getUTCFullYear()+"-"+
    two(today.getUTCMonth()+1)+"-"+
    two(today.getUTCDate());

   var hourly=[];

   for(var d=0;d<days.length;d++){

    if(days[d].date!==todayString)continue;

    for(var i=0;i<days[d].hourly.length;i++){

     var item=days[d].hourly[i];
     var hour=Math.floor(parseInt(item.time,10)/100);

     if(hour<currentHour)continue;

     hourly.push({
      time:two(hour)+":00",
      temp:parseFloat(item.tempC),
      icon:"🌤️",
      rain:(parseInt(item.chanceofrain,10)||0)+"%"
     });
    }
   }

   if(hourly.length===0)throw new Error("No hourly data");

   callback(true,{
    name:"WTTR.IN",
    temp:parseFloat(c.temp_C),
    feels:parseFloat(c.FeelsLikeC),
    humidity:parseInt(c.humidity,10),
    wind:Math.round(parseFloat(c.windspeedKmph)/3.6*10)/10,
    pressure:parseFloat(c.pressure),
    code:3,
    day:true,
    icon:"🌤️",
    description:"Погода WTTR.IN",
    hourly:hourly.slice(0,8)
   });

  }catch(e){
   callback(false);
  }

 });
}


/* MET NORWAY */

function metIcon(s){

 if(!s)return "☁️";
 if(s.indexOf("thunder")>=0)return "⛈️";
 if(s.indexOf("snow")>=0)return "❄️";
 if(s.indexOf("rain")>=0||s.indexOf("sleet")>=0)return "🌧️";
 if(s.indexOf("fog")>=0)return "🌫️";
 if(s.indexOf("clear")>=0)return "☀️";
 if(s.indexOf("partlycloudy")>=0)return "🌤️";

 return "☁️";
}

function loadMet(callback){

 request(API_MET,function(ok,data){

  if(!ok||!data.properties||!data.properties.timeseries){
   callback(false);
   return;
  }

  try{

   var series=data.properties.timeseries;
   var now=Date.now();
   var current=null;
   var hourly=[];

   for(var i=0;i<series.length;i++){

    var item=series[i];
    var t=new Date(item.time).getTime();
    var instant=item.data.instant.details;

    if(!current&&t<=now+3600000){
     current=instant;
    }

    if(t>=now&&hourly.length<8){

     var next=item.data.next_1_hours||item.data.next_6_hours;
     var symbol=next&&next.summary?
      next.summary.symbol_code:"cloudy";

     var rain=next&&next.details?
      next.details.precipitation_amount:0;

     var localTime=new Date(t+10800000);

     hourly.push({
      time:two(localTime.getUTCHours())+":00",
      temp:instant.air_temperature,
      icon:metIcon(symbol),
      rain:(rain||0)+" мм"
     });
    }
   }

   if(!current||hourly.length===0){
    throw new Error("No MET data");
   }

   var symbolNow=series[0].data.next_1_hours?
    series[0].data.next_1_hours.summary.symbol_code:"cloudy";

   callback(true,{
    name:"MET Norway",
    temp:current.air_temperature,
    feels:current.apparent_air_temperature||current.air_temperature,
    humidity:current.relative_humidity||0,
    wind:Math.round(current.wind_speed*10)/10,
    pressure:current.air_pressure_at_sea_level,
    code:3,
    day:true,
    icon:metIcon(symbolNow),
    description:"Погода MET Norway",
    hourly:hourly
   });

  }catch(e){
   callback(false);
  }

 });
}


/* ПРОВЕРКА ВСЕХ ИСТОЧНИКОВ */

function checkAll(){

 if(checking)return;

 checking=true;

 document.getElementById("updated").innerHTML=
 "Проверка источников...";

 var providers=[
  {name:"Open-Meteo",load:loadOpen},
  {name:"WTTR.IN",load:loadWttr},
  {name:"MET Norway",load:loadMet}
 ];

 var results=0;
 var previous=activeSource;

 function finish(){

  results++;

  if(results!==providers.length)return;

  checking=false;
  renderSources();

  if(previous&&available[previous]){
   selectSource(previous);
  }else{

   var order=["Open-Meteo","WTTR.IN","MET Norway"];
   var chosen=null;

   for(var i=0;i<order.length;i++){
    if(available[order[i]]){
     chosen=order[i];
     break;
    }
   }

   if(chosen){
    selectSource(chosen);
   }else{

    document.getElementById("updated").innerHTML=
     "Источники недоступны";

    document.getElementById("error").innerHTML=
     "Нет соединения. Повторная проверка через 15 минут.";

    showSaved();
   }
  }
 }

 for(var i=0;i<providers.length;i++){

  (function(p){

   p.load(function(ok,data){

    available[p.name]=ok;

    if(ok){
     cache[p.name]=data;
    }else{
     delete cache[p.name];
    }

    finish();
   });

  })(providers[i]);
 }
}


/* ПОСЛЕДНИЕ СОХРАНЁННЫЕ ДАННЫЕ */

function showSaved(){

 try{

  var saved=localStorage.getItem("donetskWeather");

  if(!saved)return;

  var data=JSON.parse(saved);

  document.getElementById("temperature").innerHTML=
   Math.round(data.temp)+"°";

  document.getElementById("description").innerHTML=
   data.icon+" "+data.description;

  document.getElementById("feels").innerHTML=
   "🌡 Ощущается: "+Math.round(data.feels)+"°";

  document.getElementById("humidity").innerHTML=
   "💧 Влажность: "+data.humidity+"%";

  document.getElementById("wind").innerHTML=
   "💨 Ветер: "+data.wind+" м/с";

  document.getElementById("pressure").innerHTML=
   "🌡 Давление: "+
   (data.pressure?Math.round(data.pressure*.75006):"--")+" мм";

  var html="";

  for(var i=0;i<data.hourly.length;i++){

   var h=data.hourly[i];

   html+='<div class="hour">'+
    '<div class="hour-time">'+h.time+'</div>'+
    '<div class="hour-icon">'+h.icon+'</div>'+
    '<div class="hour-temp">'+Math.round(h.temp)+'°</div>'+
    '<div class="hour-rain">💧 '+h.rain+'</div>'+
    '</div>';
  }

  document.getElementById("hourly").innerHTML=html;

 }catch(e){}
}


/* ЗАПУСК */

try{
 showSaved();
}catch(e){}

checkAll();

/* Проверяем погоду каждые 15 минут */
setInterval(checkAll,15*60*1000);

/* При возвращении на страницу */
document.addEventListener("visibilitychange",function(){

 if(!document.hidden){
  updateClock();
  checkAll();
 }
});

</script>
