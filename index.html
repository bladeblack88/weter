
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07152f">

<title>Донецк — Погода и часы</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07152f;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background:
      radial-gradient(ellipse at 50% 45%,
      rgba(0,100,255,.35), transparent 65%),
      linear-gradient(135deg,#10152e,#061b45,#020b20);
}

.app {
    width: 100%;
    height: 100%;
    min-height: 100%;
    padding: 18px 3%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: center;
}

.header {
    display: flex;
    justify-content: space-between;
    text-align: left;
    align-items: flex-start;
}

.city {
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 3px;
}

.date {
    font-size: 15px;
    margin-top: 8px;
    opacity: .85;
}

.source {
    text-align: right;
    font-size: 13px;
    opacity: .85;
}

.clock-area {
    width: 100%;
    margin: auto 0;
}

.clock {
    display: inline-block;
    white-space: nowrap;
    font-size: 17vw;
    font-weight: 300;
    letter-spacing: 2px;
    line-height: 1.15;
    color: #fff;
    text-shadow:
      0 0 8px #fff,
      0 0 20px #008cff,
      0 0 45px #0077ff,
      0 0 75px #0066ff;
}

.seconds {
    font-size: 5vw;
    vertical-align: 20%;
    margin-left: 4px;
    opacity: .95;
}

.temperature {
    font-size: 75px;
    font-weight: 300;
    margin-top: 28px;
    text-shadow:
      0 0 12px #fff,
      0 0 35px #008cff;
}

.description {
    font-size: 22px;
    margin-top: 8px;
}

.details {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    font-size: 17px;
    margin: 22px 0;
}

.forecast-title {
    font-size: 17px;
    letter-spacing: 3px;
    margin: 15px 0;
}

.forecast {
    display: flex;
    width: 100%;
    justify-content: center;
    gap: 6px;
}

.hour {
    flex: 1;
    min-width: 0;
    border: 1px solid rgba(85,170,255,.75);
    border-radius: 14px;
    background: rgba(35,100,190,.18);
    box-shadow: 0 0 10px rgba(0,120,255,.2);
    padding: 12px 3px;
}

.hour-time {
    font-size: 15px;
    font-weight: bold;
}

.hour-icon {
    font-size: 25px;
    margin: 9px 0;
}

.hour-temp {
    font-size: 21px;
    font-weight: bold;
}

.hour-rain {
    font-size: 12px;
    margin-top: 7px;
    color: #8ceaff;
}

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    font-size: 12px;
    opacity: .8;
}

button {
    border: 1px solid #65baff;
    color: white;
    background: rgba(30,120,255,.3);
    border-radius: 25px;
    padding: 12px 22px;
    font-size: 15px;
    box-shadow: 0 0 15px rgba(0,130,255,.4);
}

button:active {
    background: #087aff;
}

.status {
    font-size: 12px;
    margin-top: 8px;
    opacity: .7;
}

@media (orientation: portrait) {
    .clock {
        font-size: 19vw;
    }

    .seconds {
        font-size: 6vw;
    }

    .forecast {
        flex-wrap: wrap;
    }

    .hour {
        flex: 1 1 20%;
    }
}

@media (max-height: 650px) {
    .app {
        padding: 10px 3%;
    }

    .clock {
        font-size: 15vw;
    }

    .temperature {
        font-size: 55px;
        margin-top: 8px;
    }

    .details {
        margin: 10px 0;
    }

    .hour {
        padding: 7px 2px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div>
            <div class="city">ДОНЕЦК · ДНР</div>
            <div class="date" id="date">Загрузка даты...</div>
        </div>

        <div class="source">
            LIVE WEATHER<br>
            MET Norway
        </div>
    </div>

    <div class="clock-area">

        <div class="clock">
            <span id="hours">00:00</span>
            <span class="seconds" id="seconds">00</span>
        </div>

        <div class="temperature" id="temperature">--°</div>

        <div class="description" id="description">
            Загрузка погоды...
        </div>

        <div class="details">
            <span>🌡 Ощущается: <b id="feels">--°</b></span>
            <span>💧 Влажность: <b id="humidity">--%</b></span>
            <span>🌬 Ветер: <b id="wind">-- м/с</b></span>
            <span>🌡 Давление: <b id="pressure">-- мм</b></span>
        </div>

    </div>

    <div>
        <div class="forecast-title">
            ПРОГНОЗ НА БЛИЖАЙШИЕ 8 ЧАСОВ
        </div>

        <div class="forecast" id="forecast">
            <div>Загрузка прогноза...</div>
        </div>

        <div class="bottom">
            <span id="updated">MET Norway</span>
            <button onclick="loadWeather()">↻ Обновить</button>
        </div>

        <div class="status" id="status">
            Подключение к погодному сервису...
        </div>
    </div>

</div>

<script>
var LAT = 48.0159;
var LON = 37.8029;

var API =
"https://api.met.no/weatherapi/locationforecast/2.0/compact?lat="
+ LAT + "&lon=" + LON;

var lastData = null;

function updateClock() {
    var now = new Date();

    var options = {
        timeZone: "Europe/Moscow",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
    };

    var time = new Intl.DateTimeFormat("ru-RU", options)
        .format(now);

    var seconds = new Intl.DateTimeFormat("ru-RU", {
        timeZone: "Europe/Moscow",
        second: "2-digit"
    }).format(now);

    document.getElementById("hours").innerHTML = time;
    document.getElementById("seconds").innerHTML = seconds;

    document.getElementById("date").innerHTML =
        new Intl.DateTimeFormat("ru-RU", {
            timeZone: "Europe/Moscow",
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }).format(now);
}

function weatherIcon(symbol) {
    if (!symbol) return "🌤";

    if (symbol.indexOf("thunder") >= 0) return "⛈";
    if (symbol.indexOf("snow") >= 0) return "❄️";
    if (symbol.indexOf("rain") >= 0) return "🌧";
    if (symbol.indexOf("fog") >= 0) return "🌫";
    if (symbol.indexOf("cloudy") >= 0) return "☁️";
    if (symbol.indexOf("partlycloudy") >= 0) return "🌤";
    if (symbol.indexOf("clearsky") >= 0) return "☀️";
    if (symbol.indexOf("fair") >= 0) return "🌤";

    return "☁️";
}

function loadWeather() {

    document.getElementById("status").innerHTML =
        "Обновление погоды...";

    var xhr = new XMLHttpRequest();

    xhr.open("GET", API, true);
    xhr.timeout = 20000;

    xhr.onreadystatechange = function() {

        if (xhr.readyState !== 4) return;

        if (xhr.status === 200) {

            try {
                var data = JSON.parse(xhr.responseText);

                lastData = data;

                try {
                    localStorage.setItem(
                        "donetsk_weather",
                        xhr.responseText
                    );
                } catch(e) {}

                displayWeather(data);

                document.getElementById("status").innerHTML =
                    "Данные успешно обновлены";

            } catch(e) {
                showError("Ошибка обработки данных");
            }

        } else {
            showError("Ошибка подключения: " + xhr.status);
        }
    };

    xhr.onerror = function() {
        showError("Нет соединения с погодным сервисом");
    };

    xhr.ontimeout = function() {
        showError("Превышено время ожидания");
    };

    xhr.send();
}

function showError(message) {

    document.getElementById("status").innerHTML =
        message + " · Проверяем сохранённые данные";

    if (!lastData) {
        try {
            var saved = localStorage.getItem("donetsk_weather");

            if (saved) {
                lastData = JSON.parse(saved);
                displayWeather(lastData);
            }
        } catch(e) {}
    }
}

function displayWeather(data) {

    var series = data.properties.timeseries;

    if (!series || !series.length) return;

    var current = series[0].data;

    var instant = current.instant.details;

    var temp = instant.air_temperature;
    var humidity = instant.relative_humidity;
    var wind = instant.wind_speed;
    var pressure = instant.air_pressure_at_sea_level;

    document.getElementById("temperature").innerHTML =
        Math.round(temp) + "°";

    document.getElementById("description").innerHTML =
        weatherIcon(getSymbol(current)) + " Погода MET Norway";

    document.getElementById("feels").innerHTML =
        Math.round(temp - 1) + "°";

    document.getElementById("humidity").innerHTML =
        Math.round(humidity) + "%";

    document.getElementById("wind").innerHTML =
        wind.toFixed(1) + " м/с";

    document.getElementById("pressure").innerHTML =
        Math.round(pressure * 0.75006) + " мм";

    var html = "";

    var count = 0;

    for (var i = 0; i < series.length && count < 8; i++) {

        var item = series[i];

        var date = new Date(item.time);

        if (date.getTime() <= Date.now()) continue;

        var details = item.data.instant.details;

        var next = item.data.next_1_hours;

        var symbol = "";

        var rain = 0;

        if (next) {
            symbol = next.summary.symbol_code;
            rain = next.details.precipitation_amount || 0;
        }

        var hour = date.toLocaleTimeString("ru-RU", {
            timeZone: "Europe/Moscow",
            hour: "2-digit",
            minute: "2-digit"
        });

        html +=
            '<div class="hour">' +
            '<div class="hour-time">' + hour + '</div>' +
            '<div class="hour-icon">' +
            weatherIcon(symbol) + '</div>' +
            '<div class="hour-temp">' +
            Math.round(details.air_temperature) + '°</div>' +
            '<div class="hour-rain">💧 ' +
            rain.toFixed(1) + ' мм</div>' +
            '</div>';

        count++;
    }

    document.getElementById("forecast").innerHTML =
        html || "Нет данных прогноза";

    document.getElementById("updated").innerHTML =
        "Обновлено: " +
        new Date().toLocaleTimeString("ru-RU");
}

function getSymbol(current) {

    if (current.next_1_hours) {
        return current.next_1_hours.summary.symbol_code;
    }

    if (current.next_6_hours) {
        return current.next_6_hours.summary.symbol_code;
    }

    return "";
}

// Запуск
updateClock();
setInterval(updateClock, 1000);

// Погода при запуске
loadWeather();

// Автоматическое обновление каждые 30 минут
setInterval(loadWeather, 30 * 60 * 1000);

// Попытка обновить данные при возвращении на страницу
document.addEventListener("visibilitychange", function() {
    if (!document.hidden) loadWeather();
});
</script>

</body>
</html>
