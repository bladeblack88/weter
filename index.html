
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#100020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Донецк Погода">
<title>Донецк · Неоновые часы</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background: #090015;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
      radial-gradient(ellipse at 50% 35%, #421080 0%, transparent 48%),
      radial-gradient(ellipse at 15% 70%, #24004f 0%, transparent 45%),
      radial-gradient(ellipse at 90% 80%, #350078 0%, transparent 45%),
      linear-gradient(180deg, #090018, #180039 55%, #080016);
    background-attachment: fixed;
}

body:before {
    content: "";
    position: fixed;
    z-index: 0;
    inset: 0;
    pointer-events: none;
    opacity: .4;
    background-image:
      radial-gradient(2px 2px at 10% 20%, white, transparent),
      radial-gradient(2px 2px at 80% 15%, white, transparent),
      radial-gradient(1px 1px at 40% 35%, white, transparent),
      radial-gradient(2px 2px at 70% 55%, #dcaaff, transparent),
      radial-gradient(1px 1px at 25% 75%, white, transparent),
      radial-gradient(2px 2px at 90% 85%, white, transparent);
    background-size: 250px 250px;
}

.app {
    position: relative;
    z-index: 1;
    width: 100%;
    min-height: 100vh;
    padding: 22px 30px 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: center;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    text-align: left;
}

.city {
    font-size: clamp(20px, 3vw, 32px);
    font-weight: bold;
    letter-spacing: 3px;
    color: #f5d8ff;
    text-shadow: 0 0 12px #c000ff, 0 0 25px #8500ff;
}

.date {
    margin-top: 5px;
    font-size: clamp(13px, 1.8vw, 20px);
    color: #e5d5ff;
}

.live {
    text-align: right;
    font-size: 15px;
    font-weight: bold;
    color: #e7aaff;
    text-shadow: 0 0 12px #b000ff;
}

.live small {
    display: block;
    margin-top: 5px;
    font-size: 13px;
    color: white;
}

.clock-area {
    margin: 10px auto 0;
    width: 100%;
}

.clock {
    display: inline-block;
    white-space: nowrap;
    font-size: clamp(100px, 18vw, 230px);
    font-weight: 300;
    letter-spacing: -5px;
    line-height: 1.05;
    color: #fffaff;
    text-shadow:
       0 0 5px white,
       0 0 15px #e7a0ff,
       0 0 35px #b000ff,
       0 0 65px #8500ff;
}

.seconds {
    display: inline-block;
    vertical-align: 12%;
    margin-left: 5px;
    font-size: clamp(27px, 5vw, 65px);
    letter-spacing: 0;
    color: #e7aaff;
    text-shadow: 0 0 15px #b000ff;
}

.weather-main {
    margin-top: 4px;
}

.temperature {
    font-size: clamp(65px, 9vw, 110px);
    font-weight: 300;
    color: white;
    text-shadow:
      0 0 12px #fff,
      0 0 30px #b000ff,
      0 0 55px #8a00ff;
}

.weather-description {
    font-size: clamp(17px, 2.3vw, 27px);
    margin-top: 0;
}

.weather-details {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px 25px;
    margin: 18px auto 24px;
    font-size: clamp(13px, 1.7vw, 21px);
}

.detail {
    white-space: nowrap;
    padding: 5px;
    text-shadow: 0 0 10px #b000ff;
}

.detail span {
    font-size: 23px;
    margin-right: 5px;
}

.section-title {
    font-size: clamp(14px, 2vw, 24px);
    letter-spacing: 4px;
    margin: 15px 0;
    color: #f2d5ff;
    text-shadow: 0 0 12px #b000ff;
}

.forecast {
    display: flex;
    justify-content: center;
    gap: 8px;
    width: 100%;
}

.hour {
    flex: 1;
    min-width: 0;
    min-height: 145px;
    padding: 12px 3px;
    border: 1px solid #c35aff;
    border-radius: 19px;
    background: linear-gradient(
       145deg,
       rgba(94, 0, 180, .42),
       rgba(20, 0, 55, .75)
    );
    box-shadow:
       0 0 8px #9c00ff,
       inset 0 0 12px rgba(170, 0, 255, .15);
}

.hour-time {
    font-size: clamp(13px, 1.7vw, 20px);
    font-weight: bold;
}

.hour-icon {
    margin: 12px 0 8px;
    font-size: clamp(24px, 3vw, 38px);
}

.hour-temp {
    font-size: clamp(19px, 2.4vw, 28px);
    font-weight: bold;
    text-shadow: 0 0 10px #a000ff;
}

.hour-rain {
    margin-top: 7px;
    font-size: clamp(12px, 1.5vw, 17px);
    color: #bdeaff;
}

.bottom {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.status {
    font-size: clamp(12px, 1.5vw, 18px);
    color: #e8d6ff;
    text-align: left;
}

.status-dot {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    margin-right: 7px;
    background: #00ff77;
    box-shadow: 0 0 12px #00ff77;
}

.status-dot.error {
    background: #ff426e;
    box-shadow: 0 0 12px #ff426e;
}

.refresh {
    padding: 13px 28px;
    border: 1px solid #e5a0ff;
    border-radius: 40px;
    color: white;
    font-size: 17px;
    background: linear-gradient(135deg, #7900dc, #370078);
    box-shadow:
      0 0 12px #a000ff,
      0 0 25px rgba(180, 0, 255, .5);
    cursor: pointer;
}

.refresh:active {
    opacity: .7;
    transform: scale(.97);
}

.footer {
    margin-top: 15px;
    font-size: 12px;
    color: #bda2e8;
    display: flex;
    justify-content: space-between;
}

@media (max-width: 700px) {
    .app {
        padding: 15px 10px;
    }

    .clock {
        font-size: 19vw;
        letter-spacing: -3px;
    }

    .seconds {
        font-size: 5vw;
    }

    .forecast {
        gap: 4px;
    }

    .hour {
        min-height: 115px;
        border-radius: 12px;
        padding: 9px 2px;
    }

    .hour-icon {
        margin: 8px 0;
    }

    .weather-details {
        gap: 5px;
        margin: 12px 0;
    }

    .section-title {
        letter-spacing: 2px;
    }
}

@media (max-height: 600px) and (orientation: landscape) {
    .app {
        padding: 10px 22px;
    }

    .clock {
        font-size: 16vw;
    }

    .temperature {
        font-size: 65px;
    }

    .weather-details {
        margin: 8px auto;
    }

    .hour {
        min-height: 105px;
    }

    .hour-icon {
        margin: 5px 0;
    }

    .section-title {
        margin: 7px 0;
    }
}
</style>
</head>

<body>
<div class="app">

    <div class="top">
        <div>
            <div class="city">ДОНЕЦК · ДНР</div>
            <div class="date" id="date">Загрузка даты...</div>
        </div>

        <div class="live">
            LIVE WEATHER
            <small>MET Norway</small>
        </div>
    </div>

    <div class="clock-area">
        <div class="clock">
            <span id="clock">00:00</span>
            <span class="seconds" id="seconds">00</span>
        </div>
    </div>

    <div class="weather-main">
        <div class="temperature" id="temperature">--°</div>
        <div class="weather-description" id="description">
            Загрузка погоды...
        </div>
    </div>

    <div class="weather-details">
        <div class="detail">
            <span>🌡️</span>
            Ощущается: <b id="feels">—</b>
        </div>

        <div class="detail">
            <span>💧</span>
            Влажность: <b id="humidity">—</b>
        </div>

        <div class="detail">
            <span>💨</span>
            Ветер: <b id="wind">—</b>
        </div>

        <div class="detail">
            <span>🌡</span>
            Давление: <b id="pressure">—</b>
        </div>
    </div>

    <div>
        <div class="section-title">
            ПРОГНОЗ НА БЛИЖАЙШИЕ 8 ЧАСОВ
        </div>

        <div class="forecast" id="forecast">
            <div class="hour">Загрузка...</div>
        </div>
    </div>

    <div class="bottom">
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="status">Подключение к MET Norway...</span>
        </div>

        <button class="refresh" id="refresh">
            ⟳ Обновить
        </button>
    </div>

    <div class="footer">
        <span id="updated">MET Norway</span>
        <span>Донецк · MET Norway</span>
    </div>

</div>

<script>
(function() {
"use strict";

/* Координаты Донецка */
var LAT = 48.0159;
var LON = 37.8028;

/* Интервал обновления */
var UPDATE_INTERVAL = 30 * 60 * 1000;

/* Повтор при ошибке */
var RETRY_INTERVAL = 5 * 60 * 1000;

var API =
"https://api.met.no/weatherapi/locationforecast/2.0/compact?lat="
+ LAT + "&lon=" + LON;

var cacheKey = "donetsk_met_weather_v3";

var weatherData = null;
var lastUpdate = null;
var busy = false;
var retryTimer = null;
var updateTimer = null;

function el(id) {
    return document.getElementById(id);
}

/* Время Донецка */
function formatTime(date, type) {
    try {
        var options;

        if (type === "clock") {
            options = {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false,
                timeZone: "Europe/Kyiv"
            };
        } else if (type === "seconds") {
            options = {
                second: "2-digit",
                timeZone: "Europe/Kyiv"
            };
        } else if (type === "hour") {
            options = {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false,
                timeZone: "Europe/Kyiv"
            };
        } else {
            options = {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric",
                timeZone: "Europe/Kyiv"
            };
        }

        return new Intl.DateTimeFormat("ru-RU", options).format(date);

    } catch(e) {
        if (type === "clock") {
            return pad(date.getHours()) + ":" + pad(date.getMinutes());
        }

        if (type === "seconds") {
            return pad(date.getSeconds());
        }

        if (type === "hour") {
            return pad(date.getHours()) + ":00";
        }

        return date.toLocaleDateString("ru-RU");
    }
}

function pad(n) {
    return n < 10 ? "0" + n : String(n);
}

/* Живые часы */
function clockTick() {
    var now = new Date();

    el("clock").innerHTML = formatTime(now, "clock");
    el("seconds").innerHTML = formatTime(now, "seconds");
    el("date").innerHTML = formatTime(now, "date");
}

clockTick();
setInterval(clockTick, 1000);

/* Погодные символы MET Norway */
function weatherIcon(code) {
    if (!code) return "🌤️";

    if (code.indexOf("thunder") !== -1) return "⛈️";
    if (code.indexOf("snow") !== -1) return "❄️";
    if (code.indexOf("sleet") !== -1) return "🌨️";
    if (code.indexOf("rain") !== -1) return "🌧️";
    if (code.indexOf("fog") !== -1) return "🌫️";

    if (code.indexOf("clearsky") !== -1) return "☀️";
    if (code.indexOf("fair") !== -1) return "🌤️";
    if (code.indexOf("partlycloudy") !== -1) return "⛅";
    if (code.indexOf("cloudy") !== -1) return "☁️";

    return "🌤️";
}

function weatherText(code) {
    if (!code) return "Погода MET Norway";

    if (code.indexOf("thunder") !== -1) return "Гроза";
    if (code.indexOf("snow") !== -1) return "Снег";
    if (code.indexOf("sleet") !== -1) return "Мокрый снег";
    if (code.indexOf("rain") !== -1) return "Дождь";
    if (code.indexOf("fog") !== -1) return "Туман";
    if (code.indexOf("clearsky") !== -1) return "Ясно";
    if (code.indexOf("fair") !== -1) return "Малооблачно";
    if (code.indexOf("partlycloudy") !== -1) return "Переменная облачность";
    if (code.indexOf("cloudy") !== -1) return "Облачно";

    return "Погода MET Norway";
}

/* Статус подключения */
function setStatus(message, error) {
    el("status").innerHTML = message;

    if (error) {
        el("statusDot").className = "status-dot error";
    } else {
        el("statusDot").className = "status-dot";
    }
}

/* HTTP запрос: XMLHttpRequest для старых Safari */
function requestWeather(callback) {
    var xhr = new XMLHttpRequest();

    xhr.open("GET", API, true);
    xhr.timeout = 18000;
    xhr.setRequestHeader("Accept", "application/json");

    xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;

        if (xhr.status >= 200 && xhr.status < 300) {
            try {
                callback(null, JSON.parse(xhr.responseText));
            } catch(e) {
                callback("Ошибка обработки данных");
            }
        } else {
            callback("HTTP " + xhr.status);
        }
    };

    xhr.onerror = function() {
        callback("Ошибка сети или CORS");
    };

    xhr.ontimeout = function() {
        callback("Превышено время ожидания");
    };

    try {
        xhr.send();
    } catch(e) {
        callback("Не удалось отправить запрос");
    }
}

/* Сохранение данных */
function saveCache(data) {
    try {
        localStorage.setItem(cacheKey, JSON.stringify({
            data: data,
            saved: new Date().getTime()
        }));
    } catch(e) {}
}

/* Чтение сохранённых данных */
function loadCache() {
    try {
        var value = localStorage.getItem(cacheKey);

        if (!value) return null;

        var parsed = JSON.parse(value);

        if (parsed.data) {
            lastUpdate = parsed.saved;
            return parsed.data;
        }
    } catch(e) {}

    return null;
}

/* Обработка данных MET */
function parseWeather(data) {
    if (!data || !data.properties ||
        !data.properties.timeseries ||
        !data.properties.timeseries.length) {
        return null;
    }

    var series = data.properties.timeseries;
    var current = series[0];

    var instant = current.data.instant.details;

    var next = current.data.next_1_hours ||
               current.data.next_6_hours ||
               current.data.next_12_hours;

    var symbol = next && next.summary ?
                 next.summary.symbol_code : "";

    var result = {
        temperature: instant.air_temperature,
        humidity: instant.relative_humidity,
        wind: instant.wind_speed,
        pressure: instant.air_pressure_at_sea_level,
        symbol: symbol,
        forecast: []
    };

    /*
      Берём ближайшие 8 часовых значений.
      Не придумываем прогноз, если данных нет.
    */
    var now = new Date().getTime();

    for (var i = 0; i < series.length; i++) {
        var item = series[i];
        var date = new Date(item.time);

        if (date.getTime() < now) continue;

        var details = item.data.instant.details;

        var period = item.data.next_1_hours ||
                     item.data.next_6_hours ||
                     item.data.next_12_hours;

        var forecastSymbol = "";

        if (period && period.summary) {
            forecastSymbol = period.summary.symbol_code;
        }

        var precipitation = null;

        if (period && period.details &&
            typeof period.details.precipitation_amount === "number") {
            precipitation = period.details.precipitation_amount;
        }

        result.forecast.push({
            time: date,
            temperature: details.air_temperature,
            symbol: forecastSymbol,
            precipitation: precipitation
        });

        if (result.forecast.length >= 8) break;
    }

    return result;
}

/* Показ погоды */
function renderWeather(data) {
    if (!data) return;

    weatherData = data;

    el("temperature").innerHTML =
        Math.round(data.temperature) + "°";

    el("description").innerHTML =
        weatherIcon(data.symbol) + " Погода MET Norway";

    el("humidity").innerHTML =
        Math.round(data.humidity) + "%";

    el("wind").innerHTML =
        data.wind.toFixed(1) + " м/с";

    if (typeof data.pressure === "number") {
        var mm = Math.round(data.pressure * 0.750062);
        el("pressure").innerHTML = mm + " мм";
    } else {
        el("pressure").innerHTML = "—";
    }

    /*
      MET Norway не предоставляет feels-like
      в этом наборе данных. Не подменяем его
      выдуманным значением.
    */
    el("feels").innerHTML = "—";

    renderForecast(data.forecast);
}

/* Прогноз */
function renderForecast(forecast) {
    var container = el("forecast");
    container.innerHTML = "";

    if (!forecast || !forecast.length) {
        container.innerHTML =
            '<div class="hour">Нет данных прогноза</div>';
        return;
    }

    for (var i = 0; i < forecast.length; i++) {
        var item = forecast[i];

        var rain = item.precipitation === null ?
            "—" :
            item.precipitation.toFixed(1) + " мм";

        var card = document.createElement("div");
        card.className = "hour";

        card.innerHTML =
            '<div class="hour-time">' +
                formatTime(item.time, "hour") +
            '</div>' +
            '<div class="hour-icon">' +
                weatherIcon(item.symbol) +
            '</div>' +
            '<div class="hour-temp">' +
                Math.round(item.temperature) + '°' +
            '</div>' +
            '<div class="hour-rain">💧 ' + rain + '</div>';

        container.appendChild(card);
    }
}

/* Обновление данных */
function updateWeather() {
    if (busy) return;

    busy = true;
    setStatus("Подключение к MET Norway...", false);

    requestWeather(function(error, response) {
        busy = false;

        if (!error) {
            var parsed = parseWeather(response);

            if (parsed) {
                saveCache(parsed);
                lastUpdate = new Date().getTime();

                renderWeather(parsed);

                setStatus("Погода обновлена", false);

                el("updated").innerHTML =
                    "Обновлено: " +
                    formatTime(new Date(), "clock");

                if (retryTimer) {
                    clearTimeout(retryTimer);
                    retryTimer = null;
                }

                return;
            }

            error = "Нет погодных данных";
        }

        console.log("MET Norway:", error);

        var cached = loadCache();

        if (cached) {
            renderWeather(cached);

            setStatus(
                "Нет соединения · показаны сохранённые данные",
                true
            );

            el("updated").innerHTML =
                "Последние данные: " +
                (lastUpdate ?
                    new Date(lastUpdate).toLocaleString("ru-RU") :
                    "ранее");
        } else {
            setStatus("Нет соединения · " + error, true);
            el("updated").innerHTML = "Ожидание подключения";
        }

        /*
          Повторяем попытку через 5 минут.
        */
        if (retryTimer) clearTimeout(retryTimer);

        retryTimer = setTimeout(function() {
            if (navigator.onLine !== false) {
                updateWeather();
            }
        }, RETRY_INTERVAL);
    });
}

/* Ручное обновление */
el("refresh").onclick = function() {
    if (retryTimer) {
        clearTimeout(retryTimer);
        retryTimer = null;
    }

    updateWeather();
};

/* Проверка возвращения интернета */
window.addEventListener("online", function() {
    updateWeather();
});

window.addEventListener("offline", function() {
    setStatus("Нет интернета · используем сохранённые данные", true);
});

/* Первый запуск */
var cached = loadCache();

if (cached) {
    renderWeather(cached);
    setStatus("Показаны последние данные · обновляем...", false);
}

updateWeather();

/* Плановое обновление каждые 30 минут */
updateTimer = setInterval(function() {
    if (navigator.onLine !== false) {
        updateWeather();
    }
}, UPDATE_INTERVAL);

/* При возвращении на страницу проверяем данные */
document.addEventListener("visibilitychange", function() {
    if (!document.hidden) {
        clockTick();

        if (!lastUpdate ||
            new Date().getTime() - lastUpdate > 5 * 60 * 1000) {
            updateWeather();
        }
    }
});

})();
</script>
</body>
</html>
